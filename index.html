<style>
.jobs-float-btn {
  position: fixed;
  bottom: 70px;
  left: 20px;
  background: linear-gradient(135deg,#0d47a1,#1976d2);
  color: white;
  padding: 14px 22px;
  border-radius: 50px;
  font-weight: 900;
  font-size: 16px;
  box-shadow: 0 6px 20px rgba(13,71,161,0.5);
  cursor: pointer;
  z-index: 9999;
  border: 2px solid #fff;
  animation: pulseJobs 2s infinite;
}
@keyframes pulseJobs { 0%{transform:scale(1)} 50%{transform:scale(1.08)} 100%{transform:scale(1)} }
.jobs-modal-overlay {
  display: none;
  position: fixed;
  top:0; left:0; right:0; bottom:0;
  background: rgba(0,0,0,0.7);
  z-index: 10000;
  overflow-y: auto;
  padding: 20px;
}
.jobs-modal {
  background: white;
  max-width: 600px;
  margin: 20px auto;
  border-radius: 20px;
  padding: 24px;
  position: relative;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.jobs-modal h2 { color: #0d47a1; font-size: 24px; font-weight: 900; margin-bottom: 6px; text-align: center; }
.jobs-modal .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; }
.jobs-form-group { margin-bottom: 14px; }
.jobs-form-group label { display: block; font-weight: 700; margin-bottom: 6px; color: #333; font-size: 14px; }
.jobs-form-group input, .jobs-form-group select, .jobs-form-group textarea {
  width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; font-family: inherit;
}
.jobs-form-group input:focus, .jobs-form-group select:focus, .jobs-form-group textarea:focus { border-color: #1976d2; outline: none; }
.jobs-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.jobs-submit-btn { width: 100%; background: linear-gradient(135deg,#0d47a1,#1976d2); color: white; padding: 14px; border: none; border-radius: 12px; font-weight: 900; font-size: 16px; cursor: pointer; margin-top: 10px; }
.jobs-close { position: absolute; top: 12px; right: 16px; font-size: 28px; cursor: pointer; color: #999; }
.jobs-badge { display: inline-block; background: #e3f2fd; color: #0d47a1; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; margin: 3px; }
</style>

<!-- Video Fix - منع الفيديوهات المقترحة الغريبة -->
<script>
(function(){
  function fixYouTubeIframes(){
    const iframes = document.querySelectorAll('iframe[src*="youtube.com"], iframe[src*="youtu.be"]');
    iframes.forEach(iframe => {
      try {
        let src = iframe.src;
        // Use nocookie domain to prevent tracking and suggestions
        src = src.replace('www.youtube.com', 'www.youtube-nocookie.com');
        src = src.replace('youtube.com', 'youtube-nocookie.com');
        
        const url = new URL(src);
        // منع الفيديوهات المقترحة من قنوات تانية
        url.searchParams.set('rel', '0'); // فقط فيديوهات من نفس القناة
        url.searchParams.set('modestbranding', '1'); // شعار صغير
        url.searchParams.set('iv_load_policy', '3'); // بدون تعليقات
        url.searchParams.set('showinfo', '0');
        url.searchParams.set('origin', window.location.origin);
        // منع اقتراحات نهاية الفيديو الغريبة
        url.searchParams.set('playsinline', '1');
        
        if(iframe.src !== url.toString()){
          iframe.src = url.toString();
        }
      } catch(e){}
    });
    
    // إصلاح روابط اليوتيوب لتفتح في نفس الصفحة بدون اقتراحات
    const ytLinks = document.querySelectorAll('a[href*="youtube.com/watch"], a[href*="youtu.be"]');
    ytLinks.forEach(a => {
      a.addEventListener('click', function(e){
        e.preventDefault();
        const url = new URL(this.href);
        let videoId = url.searchParams.get('v') || url.pathname.split('/').pop();
        if(videoId){
          openCleanVideoModal(videoId);
        }
      });
    });
  }
  
  window.openCleanVideoModal = function(videoId){
    let modal = document.getElementById('cleanVideoModal');
    if(!modal){
      modal = document.createElement('div');
      modal.id = 'cleanVideoModal';
      modal.style.cssText = 'display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.95); z-index:10001; padding:20px; overflow-y:auto;';
      modal.innerHTML = `
        <div style="max-width:900px; margin:20px auto; position:relative; background:#000; border-radius:16px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,0.8);">
          <span onclick="closeCleanVideoModal()" style="position:absolute; top:12px; right:16px; color:white; font-size:32px; cursor:pointer; z-index:10; background:rgba(0,0,0,0.5); width:40px; height:40px; border-radius:50%; display:grid; place-items:center;">&times;</span>
          <div style="position:relative; padding-bottom:56.25%; height:0; background:#000;">
            <iframe id="cleanVideoIframe" style="position:absolute; top:0; left:0; width:100%; height:100%; border:none;" 
              src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
          <div style="padding:14px; background:#111; color:white; text-align:center;">
            <div style="font-weight:700;">Lady Driving For All - فيديوهات تدريب حصرية</div>
            <div style="font-size:12px; opacity:0.7; margin-top:4px;">📍 80 خاتم المرسلين - الجيزة | فيديوهات من تدريبنا الحقيقي فقط</div>
          </div>
        </div>
      `;
      modal.onclick = function(e){ if(e.target===modal) closeCleanVideoModal(); };
      document.body.appendChild(modal);
    }
    const iframe = document.getElementById('cleanVideoIframe');
    iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?rel=0&modestbranding=1&iv_load_policy=3&playsinline=1&origin=${window.location.origin}`;
    modal.style.display = 'block';
    document.body.style.overflow = 'hidden';
  };
  
  window.closeCleanVideoModal = function(){
    const modal = document.getElementById('cleanVideoModal');
    const iframe = document.getElementById('cleanVideoIframe');
    if(iframe) iframe.src = '';
    if(modal) modal.style.display = 'none';
    document.body.style.overflow = 'auto';
  };
  
  // إصلاح الفيديوهات كل ثانية لأن React بيحملها متأخر
  let attempts = 0;
  const interval = setInterval(()=>{
    attempts++;
    fixYouTubeIframes();
    if(attempts > 30) clearInterval(interval);
  }, 1000);
  
  document.addEventListener('DOMContentLoaded', ()=>{ setTimeout(fixYouTubeIframes, 2000); });
})();
</script>

</style>
<script>
(function(){
  function hideBadge(){
    // Method 1: Find by exact text
    document.querySelectorAll('div').forEach(el => {
      if(el.textContent && el.textContent.trim() === 'الأكثر طلباً'){
        el.style.display = 'none';
        el.style.visibility = 'hidden';
        el.style.opacity = '0';
        el.style.height = '0';
        el.style.width = '0';
        el.style.overflow = 'hidden';
        // Hide parents if they only contain this badge
        let parent = el.parentElement;
        for(let i=0; i<3; i++){
          if(parent && parent.textContent.trim() === 'الأكثر طلباً'){
            parent.style.display = 'none';
            parent = parent.parentElement;
          }
        }
      }
    });
    
    // Method 2: Tree walker for text nodes
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
    let node;
    let nodesToHide = [];
    while(node = walker.nextNode()){
      if(node.nodeValue && node.nodeValue.trim() === 'الأكثر طلباً'){
        nodesToHide.push(node);
      }
    }
    nodesToHide.forEach(textNode => {
      let el = textNode.parentElement;
      for(let i=0; i<5; i++){
        if(!el) break;
        if(el.textContent.trim() === 'الأكثر طلباً' || el.textContent.includes('الأكثر طلباً') && el.textContent.length < 30){
          el.style.setProperty('display', 'none', 'important');
          el.style.setProperty('visibility', 'hidden', 'important');
        }
        el = el.parentElement;
      }
    });
    
    // Method 3: Hide by removing from DOM after React renders
    document.querySelectorAll('*').forEach(el => {
      if(el.childNodes.length === 1 && el.textContent === 'الأكثر طلباً'){
        el.remove();
      }
    });
  }
  
  // Run aggressively
  setInterval(hideBadge, 300);
  window.addEventListener('load', hideBadge);
  document.addEventListener('DOMContentLoaded', hideBadge);
  setTimeout(hideBadge, 100);
  setTimeout(hideBadge, 1000);
  setTimeout(hideBadge, 2000);
  setTimeout(hideBadge, 3000);
  
  // Also patch the data source - replace mostPopular text with empty
  const originalText = 'الأكثر طلباً';
  // Try to hide via CSS injection targeting common badge classes
  const style = document.createElement('style');
  style.textContent = `
    /* Aggressive hide */
    div[style*="absolute"] { 
      /* Only hide if it contains exactly الأكثر طلبا */
    }
  `;
  document.head.appendChild(style);
})();

  try {
    const html = document.documentElement.innerHTML;
    if(html.includes('الأكثر طلباً')){
      // We can't easily replace in React bundle, so we hide visually
    }
  } catch(e){}
})();
</script>
<script>
// Final nuclear option: CSS that hides any element with that text using :has (modern browsers)
(function(){
  const finalStyle = document.createElement('style');
  finalStyle.textContent = `
    /* Hide the badge completely - nuclear option */
    body * {
      /* We will hide via JS, but add backup */
    }
  `;
  document.head.appendChild(finalStyle);
  
  // Keep hiding
  const observer = new MutationObserver(() => {
    document.querySelectorAll('div').forEach(el => {
      if(el.textContent.trim() === 'الأكثر طلباً' && el.offsetWidth < 200){
        el.style.display = 'none';
        el.remove();
      }
    });
  });
  observer.observe(document.body, { childList: true, subtree: true });
})();
</script>
